[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engops"
dynamic = ["version"]
description = "Engineering Team Operations Platform - offline-first desktop workspace"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6-Essentials>=6.11,<6.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.dynamic]
version = { attr = "engops.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"engops.infrastructure.database.migrations" = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]